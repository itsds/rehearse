          - Публиковал сообщение с mandatory=True и delivery_mode=2
          - Возвращал True, если сообщение подтверждено, иначе False

          Используйте `channel.confirm_delivery()` — возвращает True/False.
          Подключение к RabbitMQ уже настроено.
