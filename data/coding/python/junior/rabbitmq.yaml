tasks:
  - id: "rabbitmq-j-001"
    difficulty: 2
    tags: ["rabbitmq", "pika", "producer", "confirms", "mandatory", "persistence"]
    coding:
      language: python
      evaluation_mode: ai
      assignment:
        en: |
          Context:
          You need to implement a RabbitMQ producer that sends messages with
          publisher confirms, mandatory flag, and message persistence.

          Your task:
          Complete the `publish` method so that it:
          - Enables publisher confirms on the channel
          - Declares the exchange as durable topic exchange
          - Publishes the message with mandatory=True and persistent delivery_mode=2
          - Returns True if the message was confirmed, False otherwise

          Use `channel.confirm_delivery()` which returns True/False on publish.
          The connection setup is already done.
        ru: |
