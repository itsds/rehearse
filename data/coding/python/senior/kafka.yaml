  - id: "kafka-s-004"
    difficulty: 4
    tags: ["kafka", "multiprocessing", "high-throughput", "parallel-processing", "backpressure"]
    coding:
      language: python
      evaluation_mode: ai
      assignment:
        en: |
          Context:
          You need to implement parallel Kafka message processing using multiprocessing.
          One consumer process reads messages and distributes them to worker processes
          via a queue.

          Your task:
          Complete the implementation so that:
          - The consumer reads messages from Kafka and puts them into the multiprocessing queue
          - Worker processes take messages from the queue and process them
          - The queue is bounded (maxsize=1000) for backpressure
          - Workers can be gracefully stopped by sending None sentinels
          - The consumer commits offsets periodically (not after each message)

          The worker function skeleton and the main function are partially implemented.
        ru: |
          Контекст:
          Нужно реализовать параллельную обработку Kafka сообщений через multiprocessing.

          Задача:
          Реализуйте: один процесс-консьюмер читает из Kafka и распределяет сообщения
          в воркер-процессы через очередь.
          - Очередь ограничена (maxsize=1000) для backpressure
          - Воркеры завершаются при получении None
          - Consumer коммитит офсеты периодически
      starter_code: |
        import multiprocessing as mp
        from confluent_kafka import Consumer
        import time
        import logging

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)


        def worker_process(in_queue, worker_id):
            """Take messages from queue and process them."""
            while True:
                msg = in_queue.get()
                if msg is None:
                    break
                # TODO: simulate processing (time.sleep(0.1)), log result
                pass


        def main():
            queue = mp.Queue(maxsize=1000)

            # Start worker processes
            num_workers = 4
            workers = [
                mp.Process(target=worker_process, args=(queue, i))
                for i in range(num_workers)
            ]
            for w in workers:
                w.start()

            # Consumer process
            consumer = Consumer({
                "bootstrap.servers": "localhost:9092",
                "group.id": "mp-group",
                "enable.auto.commit": False,
            })
            consumer.subscribe(["topic"])

            # TODO: poll loop - get messages, put in queue, commit periodically
            try:
                pass
            finally:
                # Stop workers
                for _ in workers:
                    queue.put(None)
                for w in workers:
                    w.join()
                consumer.close()


        if __name__ == "__main__":
            main()
    expected_points:
      - "Worker processes loop reading from queue and processing"
      - "Main consumer polls Kafka and puts messages into the queue"
      - "Queue is bounded (maxsize=1000) for backpressure"
      - "Workers are stopped via None sentinel"
      - "Offsets are committed periodically (not per message)"