          Context:
          You need to implement Avro serialization/deserialization with Confluent Schema Registry
          for a Kafka producer and consumer.

          Your task:
          Complete the producer and consumer setup so that:
          - The producer serializes messages using AvroSerializer with a Schema Registry client
          - The consumer deserializes messages using AvroDeserializer
          - The schema defines a "User" record with "name" (string) and "age" (int)
          - The SerializationContext is properly set with the topic and MessageField

