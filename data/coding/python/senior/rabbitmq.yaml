  - id: "rabbitmq-s-002"
    difficulty: 4
    tags: ["rabbitmq", "dlx", "retry", "exponential-backoff", "ttl", "dead-letter"]
    coding:
      language: python
      evaluation_mode: ai
      assignment:
        en: |
          Context:
          You need to implement a retry pattern with dead-letter exchange (DLX) in RabbitMQ.
          When a message processing fails, it should be sent to a retry queue with a TTL delay,
          and then automatically returned to the main queue for reprocessing.

          Your task:
          Complete the setup so that:
          - A main queue is declared with DLX pointing to retry_exchange
          - A retry queue is declared with TTL (5000ms) and DLX pointing back to the main exchange
          - The retry exchange is a direct exchange
          - The consumer acks on success, nacks with requeue=False on failure (message goes to DLX → retry)
          - After TTL expires, the message automatically returns to the main queue

          The exchanges and the consumer callback are partially implemented.
        ru: |
          Контекст:
          Нужно реализовать паттерн повтора с Dead Letter Exchange (DLX) в RabbitMQ.
          При ошибке обработки сообщение отправляется в очередь повтора с TTL задержкой,
          после чего автоматически возвращается в основную очередь.

          Задача:
          Настройте инфраструктуру так, чтобы:
          - Основная очередь объявлена с DLX, указывающим на retry_exchange
          - Очередь повтора имеет TTL (5000ms) и DLX обратно на основной exchange
          - Consumer подтверждает успех, при ошибке nack с requeue=False
          - По истечении TTL сообщение автоматически возвращается в основную очередь
      starter_code: |
        import pika
        import logging

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)


        class RetryConsumer:
            def __init__(self, host="localhost"):
                self.connection = pika.BlockingConnection(
                    pika.ConnectionParameters(host)
                )
                self.channel = self.connection.channel()

                # Declare exchanges
                self.channel.exchange_declare(
                    "dlx_exchange", exchange_type="direct", durable=True
                )
                self.channel.exchange_declare(
                    "retry_exchange", exchange_type="direct", durable=True
                )

                # TODO: declare main_queue with DLX -> retry_exchange
                # TODO: declare retry_queue with TTL and DLX -> dlx_exchange
                # TODO: bind queues to exchanges

                self.channel.basic_qos(prefetch_count=1)

            def callback(self, ch, method, properties, body):
                """Process message, ack on success, nack on failure."""
                try:
                    logger.info(f"Processing: {body}")
                    # simulate processing
                    ch.basic_ack(delivery_tag=method.delivery_tag)
                except Exception:
                    # TODO: nack with requeue=False -> message goes to DLX -> retry queue
                    pass

            def consume(self, queue):
                self.channel.basic_consume(
                    queue, self.callback, auto_ack=False
                )
                logger.info("Waiting for messages...")
                self.channel.start_consuming()

            def close(self):
                if self.connection and self.connection.is_open:
                    self.connection.close()


        consumer = RetryConsumer()
        try:
            consumer.consume("main_queue")
        except KeyboardInterrupt:
            consumer.close()
    expected_points:
      - "Declares dlx_exchange and retry_exchange as direct"
      - "Main queue has x-dead-letter-exchange=retry_exchange and x-dead-letter-routing-key=retry"
      - "Retry queue has x-dead-letter-exchange=dlx_exchange, x-dead-letter-routing-key=main, and x-message-ttl=5000"
      - "Queues are bound to their respective exchanges"
      - "Consumer nacks with requeue=False on failure → message goes to DLX → retry queue"
      - "After TTL, message returns to main queue automatically"