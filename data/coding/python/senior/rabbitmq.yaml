        en: |
          Context:
          You need to implement a classic RPC pattern over RabbitMQ.
          The client sends a request with a unique correlation_id and a reply_to queue.
          The server processes the request and sends the response back.

          Your task:
          Complete the RPC Client so that:
          - The client declares an exclusive callback queue for responses
          - Each request generates a unique correlation_id
          - The request includes reply_to and correlation_id in properties
          - The client waits for the response with a timeout
          - If the timeout expires, it raises TimeoutError

          Complete the RPC Server so that:
          - It consumes from the rpc_queue
          - It processes the request (calls process_request)
          - It sends the response to the reply_to queue with the same correlation_id
          - It acknowledges the original message

          The server's process_request function is already implemented.
