  - id: "kafka-m-001"
    difficulty: 3
    tags: ["kafka", "consumer", "manual-commit", "offset", "confluent-kafka", "error-handling"]
    coding:
      language: python
      evaluation_mode: ai
      assignment:
        en: |
          Context:
          You need to implement a Kafka consumer with manual offset commit.
          The consumer should read messages, process them, and commit offsets
          only after successful processing.

          Your task:
          Complete the `consume` method so that it:
          - Subscribes to the given topic
          - Polls messages in a loop (timeout=1.0)
          - Skips empty messages (poll returns None)
          - Logs and skips messages with errors
          - Processes the message (calls process_msg)
          - Commits the offset synchronously after successful processing
          - Handles KeyboardInterrupt gracefully and closes the consumer
