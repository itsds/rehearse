  - id: "kafka-m-002"
    difficulty: 3
    tags: ["kafka", "aiokafka", "asyncio", "fastapi", "consumer", "startup-shutdown"]
    coding:
      language: python
      evaluation_mode: ai
      assignment:
        en: |
          Context:
          You need to integrate an async Kafka consumer (aiokafka) into a FastAPI application.
          The consumer should start on application startup and stop on shutdown.

          Your task:
          Complete the `consume_loop` coroutine so that it:
          - Iterates over messages from the consumer
          - Processes each message via `process_message`
          - Commits the offset manually after processing

          The FastAPI app, consumer setup, and startup/shutdown events are already in place.
          Use `async for msg in consumer:` for iteration.
        ru: |
          Контекст:
          Нужно интегрировать асинхронный Kafka консьюмер (aiokafka) в FastAPI приложение.

          Задача:
          Реализуйте корутину `consume_loop` так, чтобы она:
          - Итерировалась по сообщениям от consumer
          - Обрабатывала каждое сообщение через `process_message`
          - Коммитила офсет после обработки

          FastAPI приложение, consumer и события startup/shutdown уже настроены.
          Используйте `async for msg in consumer:` для итерации.
      starter_code: |
        from fastapi import FastAPI
        from aiokafka import AIOKafkaConsumer
        import asyncio
        import logging

        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        app = FastAPI()
        consumer = AIOKafkaConsumer(
            "mytopic",
            bootstrap_servers="localhost:9092",
            group_id="fastapi-group",
        )


        async def process_message(msg):
            """Simulate message processing."""
            logger.info(f"Processed: {msg.value}")
            await asyncio.sleep(0.1)


        async def consume_loop():
            """Consume messages in a loop."""
            # TODO: iterate over consumer, process each message, commit
            pass


        @app.on_event("startup")
        async def startup():
            await consumer.start()
            asyncio.create_task(consume_loop())


        @app.on_event("shutdown")
        async def shutdown():
            await consumer.stop()
    expected_points:
      - "Uses async for msg in consumer: to iterate"
      - "Calls await process_message(msg) for each message"
      - "Calls await consumer.commit() after processing"
      - "consume_loop is started as a background task on startup"